<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Font Awesome para iconos de redes sociales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="/assets/images/logo-c.svg" type="image/svg+xml">
</head>
<body>
<!-- 1. PRECARGADOR (DEBE IR AL PRINCIPIO DEL BODY) -->
  {% include preloader.html %}
  
  {% include topbar.html %}
  {% include navbar.html %}

  <main class="main-content container">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
  // Menú Hamburguesa Animado (Style #2)
  const menuToggle = document.getElementById('menuToggle');
  const mainHeader = document.querySelector('.main-header');

  menuToggle.addEventListener('click', (e) => {
    e.preventDefault();
    mainHeader.classList.toggle('nav--active');
  });

  // Conmutador Modo Oscuro / Claro
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = themeToggle.querySelector('i');
  
  const currentTheme = localStorage.getItem('theme');
  if (currentTheme === 'dark') {
    document.body.classList.add('dark-mode');
    themeIcon.classList.replace('fa-moon', 'fa-sun');
  }

  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    
    if (isDark) {
      themeIcon.classList.replace('fa-moon', 'fa-sun');
      localStorage.setItem('theme', 'dark');
    } else {
      themeIcon.classList.replace('fa-sun', 'fa-moon');
      localStorage.setItem('theme', 'light');
    }
  });

  // Texto que quieres que se mueva en la pestaña
  let textoOriginal = "Nestor Gomez - Desarrollador Freelance";
  let espacio = " ";
  let textoAnimado = textoOriginal + espacio;

  setInterval(function() {
      // Mueve el primer carácter al final del string para crear el efecto de marquesina
      textoAnimado = textoAnimado.substring(1) + textoAnimado.substring(0, 1);
      document.title = textoAnimado;
  }, 250); // El número 250 indica la velocidad en milisegundos


</script>

<!-- Botón Flotante de Telegram -->
<a href="https://t.me/ingNestorGomez" class="telegram-float" target="_blank" rel="noopener noreferrer" aria-label="Contactar por Telegram">
  <i class="fa-brands fa-telegram"></i>
</a>
  
<!-- Librería CurtainsJS para WebGL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/curtainsjs/8.1.5/curtains.min.js"></script>
  
  <!-- Tu script del Hero Slider -->
  <script src="{{ '/assets/js/hero-slider.js' | relative_url }}"></script>

  <!-- Scripts -->
  <script src="{{ '/assets/js/preloader.js' | relative_url }}"></script>
</body>
</html>
